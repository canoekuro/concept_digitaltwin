name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Shell syntax check
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -m "not spark"

  spark-test:
    name: Spark integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -m spark
