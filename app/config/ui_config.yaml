# ==============================================================================
# 簡易コンセプト調査 Web UI 設定ファイル（docs/SPEC_UI.md §2）
#
# ここに書くのは「調査をまたいで変わらないもの」だけ。
# 調査名・N数・年齢範囲・対象者条件・コンセプト・設問文は画面から入力する。
#
# 最上位は2群に分かれている。
#   survey_defaults … そのまま調査定義（survey ボリュームに置く yaml）になるもの
#   ui              … 画面を描くためだけのもの。調査定義には入らない
# 混ざっていると、設定を変えたときに調査結果が変わるのか画面の見た目が変わるのかを
# 読み分けられない。
#
# テーブルの置き場所はここに書かない。環境変数から解決する（AGENTS.md）。
#   PERSONA_SIM_CATALOG / PERSONA_SIM_SCHEMA … Unity Catalog を使う場合
#   PERSONA_SIM_WAREHOUSE                     … パス指定で置く場合
# ==============================================================================

# ==============================================================================
# A. 調査定義の既定値
#
# この下の内容は persona_sim/uiconfig/build.py が画面入力と合成して、そのまま
# 調査定義になる。スクリーニング（screening）→ 本調査（main_survey）の順に並べ、
# それぞれ model → prompt → persona_card → その他の順で書く。
# ==============================================================================
survey_defaults:
  # この画面が作る調査の種類（SPEC.md §3.0）。runs にも列として残る
  survey_type: "concept"

  # ----------------------------------------------------------------------------
  # A-1. スクリーニング（対象者の絞り込み）
  #
  # 画面で入力するのは自然言語の対象者条件1つだけ。それが調査定義の
  # screening.conditions に入る（SPEC.md §4.2）。空欄ならスクリーニングを行わない。
  # ----------------------------------------------------------------------------
  screening:
    # 判定に使うモデル。省略したキーは main_survey.model をそのまま引き継ぐ
    model:
      deployment: "databricks-gpt-5-6-luna"
      max_tokens: 256          # 番号列を返すので回答生成より多めに要る

    prompt:
      system: あなたは調査対象者の選定を担当します。提示された人物像と対象者条件を読み、条件に反する情報がある人物を除外してください。書かれている情報だけで判断し、推測で厳しく落としすぎないでください。条件に無関係な理由で人数を調整しないでください。指定された形式のみで回答し、説明や前置きは書かないでください。

      # 判定の指示行。設問タイプごとの回答指示文（main_survey.prompt.rules）とは別物
      rule: "条件に明確に反する人物のみを除き、それ以外の人の番号をカンマ区切りですべて挙げてください。判断材料が不足している場合は除外せず残してください。番号以外は書かないでください。"

    # 判定に見せるペルソナ像。
    persona_card:
      attributes:              # 属性行。載せたい属性だけを並べる（[] にすると属性行なし）
        - { field: "sex" }
        - { field: "age", suffix: "歳" }
        - { field: "marital_status" }
        - { field: "education_level" }
        - { field: "occupation_raw" }
      include_summary: true    # persona（総括文）を載せるか
      persona_fields:
        - { field: "cultural_background", label: "生活背景" }
        - { field: "professional_persona", label: "仕事" }
        - { field: "hobbies_and_interests", label: "関心事" }
        - { field: "culinary_persona", label: "食まわり" }
        - { field: "sports_persona", label: "運動習慣" }
        - { field: "travel_persona", label: "旅行の好み" }
        - { field: "arts_persona", label: "芸術・文化への関心" }
        - { field: "skills_and_expertise", label: "スキル・専門性" }
        - { field: "career_goals_and_ambitions", label: "キャリア目標" }

    oversample_factor: 2       # 候補の抽出倍率。通過者が構造的に足りないときは早期に停止する
    batch_size: 5             # 1回の判定に渡すペルソナ数
    # 条件をどう結合するか（すべて満たす／いずれかで足りる）は上の prompt.rule に書く。

  # ----------------------------------------------------------------------------
  # A-2. 本調査（回答生成）
  # ----------------------------------------------------------------------------
  main_survey:
    model:
      endpoint: "databricks"
      deployment: "databricks-gpt-5-6-luna"
      thinking: false          # 常に false（AGENTS.md 不変条件）
      # --- 出力予算（トークン）。設問タイプごとに使い分ける ---
      #
      # ここの max_tokens_* は「エンドポイント側の**絶対の打ち切り**」で、単位は
      # トークン。調査定義の questions[].max_length / .reasoning_max_length は
      # 「モデルへの**指示**」で、単位は文字。**別物なので二重管理ではない**。
      #   文字数 → モデルに「N文字以内で」と伝える目安。守られないこともある
      #   トークン → 超えたらそこで切れる。足りなければ引き上げ再送（llm/budget.py）が
      #              起き、天井まで届かないと output_limit フラグが付く
      # 片方から他方を自動計算していないのは、文字とトークンの比がモデルとトークナイザで
      # 変わるため。噛み合っていない組み合わせは validate が W_OUTPUT_BUDGET で警告する。
      max_tokens: 100          # 選択肢番号だけ返させる
      max_tokens_open: 512     # 自由回答を足す場合に使う（字数は設問の max_length）
      # 設問に reasoning: true を書いた場合に使う（SPEC.md §6.3）。
      # 理由の散文を返させるので、番号ぶんの max_tokens では必ず足りない。
      # 字数は設問の reasoning_max_length（既定80文字）。
      max_tokens_reasoning: 512
      concurrency: 32          # 想定所要時間の試算にも使う
      structured_output: "auto"
    prompt:
      # 既定の [system]。下の systems を指していない設問はこれで聞かれる
      system: |
        あなたはこれから提示する人物になりきって、調査に回答します。
        - この人物の実際の生活実感に即して答えてください
        - 調査に協力的すぎる態度をとる必要はありません。率直に回答してください。
        - 与えられたコンセプトをよく読み込み、提示する人物がどのようにとらえるかを深く考えてから回答してください。
        - 指定された形式のみで回答し、説明や前置きは書かないでください

      # 設問ごとに使い分ける [system]（SPEC.md §6.1）。
      # 下の questions: の system: に**名前**を書いて紐づける（文面は書かない）。
      # 購入意向と新規性は聞いていることの性質が違い、1本のプロンプトで兼ねるより
      # 書き分けたほうが精度が高いという実測に基づく（docs/issues/202608131659.md）。
      #
      # 文面は運用しながら調整する前提の値。変えたら examples/survey_sample.yaml も
      # 合わせて見直すこと（あちらはこのファイルの書き写し）。
      systems:
        purchase_intent: |
          あなたは、提示された人物の立場で、実際の消費行動を想像しながら調査に回答します。
          回答時のルール:
            - プロフィールに明示されていないブランド嗜好、購入経験、所得などを事実として勝手に補完しないでください。
            - コンセプトの広告表現をそのまま事実として受け入れず、商品内容をもとに判断してください。
            - 調査に好意的に答える必要はありませんが、必要以上に厳しく評価する必要もありません。
            - 指定された形式のみで回答し、説明や前置きは書かないでください。
            - 商品への好感と購入意向は区別してください。
            - 価格、容量、味、特徴などを、自分がお金を払う商品として考えてください。
            - ただし、購入とは現在の商品から完全に乗り換えることだけを意味しません。店頭で見かけた際に一度試す、気分や場面によって時々選ぶことも購入に含めて判断してください。
            - 「たぶん買う」を単なる無難な回答として選ばず、買う可能性が買わない可能性より高いと思う場合に選んでください。
            - 判断がつかない場合は「わからない」、買わない可能性の方が高い場合は購入しない側を選んでください。
            - 「必ず買う」は、かなり高い確信がある場合だけ選んでください。
        novelty: |
          あなたは、提示された人物の立場で、実際の消費行動を想像しながら調査に回答します。
          回答に関するルール:
            - プロフィールに明示されていないブランド嗜好、購入経験、所得などを事実として勝手に補完しないでください。
            - コンセプトの広告表現をそのまま事実として受け入れず、商品内容をもとに判断してください。
            - 調査に好意的に答える必要はありませんが、必要以上に厳しく評価する必要もありません。
            - 指定された形式のみで回答し、説明や前置きは書かないでください。
            - 「新しい」「今までにない」などの広告表現そのものは根拠にしないでください。
            - 同じカテゴリに属する一般的な商品と比べて、提示された人物の立場から見た新しさや違いの大きさを判断してください。
            - その人物の年齢、生活背景、仕事、関心事、食まわりなどを踏まえ、その人物自身が商品全体を見たときに、どの程度新しく、他の商品と違っていると感じるかを回答してください。
            - 他の商品との違いがあることと、「かなり新しい」「非常に新しい」ことは同じではありません。既存商品の延長として感じられる違いであれば、その程度に応じて回答してください。
            - 味、素材、商品形態、飲み方・使い方、利用場面など、特定の特徴があることだけで新しさを高く評価せず、コンセプト全体としてどの程度違って感じられるかを判断してください。
            - 5つの選択肢は「新しい／新しくない」の区分ではなく、新しさ・違いの程度が連続的に変わる尺度として使ってください。

      # 回答指示文（設問タイプごと）。{max_length} を使えるのは open のみ
      rules:
        single: "必ず設問中の選択肢の番号のみで答えてください。選択肢番号以外の回答は不可です。"
        scale: "番号のみで答えてください。番号以外の回答は不可です。"
        multi: "選択肢のうちから、当てはまる番号をすべてカンマ区切りで答えてください。"
        open: "{max_length}文字以内で答えてください。"
        numeric: "数値のみで答えてください。"
        # 設問に reasoning: true を書いたときだけ使う指示行。上の設問タイプの指示行を
        # **置き換える**（「番号のみで答えてください」と矛盾するため）。置き換えなので
        # タイプ固有の指示（multi の「すべて」）はこちらにも書く。{max_length} は
        # 設問の reasoning_max_length。
        # 下の questions: では有効にしていない。費用と所要時間が増え、画面の見積もり
        # （ui.estimation_benchmarks）が合わなくなるので、実測してから既定を決める。
        reasoning:
          single: "まず、そう考えた理由を{max_length}文字以内で書き、そのうえで当てはまる番号を1つ選んでください。"
          scale: "まず、そう考えた理由を{max_length}文字以内で書き、そのうえで当てはまる番号を1つ選んでください。"
          multi: "まず、そう考えた理由を{max_length}文字以内で書き、そのうえで選択肢のうち当てはまる番号をすべて挙げてください。"

    persona_card:
      # 属性行。載せたい属性だけを並べる（[] にすると属性行そのものが出ない）。
      # personas_base の列であれば既定の6項目以外も入れられる（region など）
      attributes:
        - { field: "sex" }
        - { field: "age", suffix: "歳" }
      include_summary: true    # persona（総括文）を載せるか

      # 本調査でペルソナカードに含める定性フィールド（下記4つを既定選択中）。
      #
      # personas_base（SPEC.md §2.1）にあるナラティブ列のうち、persona_fields に
      # 指定できるのは以下。カテゴリに応じて必要な列だけ選び直す（例: スポーツ用品なら
      # sports_persona、旅行なら travel_persona を足す）。field には personas_base の
      # 列名をそのまま書くこと（無い列を書くと validate が停止する）。

      persona_fields:
        - { field: "cultural_background", label: "生活背景" }
        - { field: "professional_persona", label: "仕事" }
        - { field: "hobbies_and_interests", label: "関心事" }
        - { field: "culinary_persona", label: "食まわり" }
        # - { field: "sports_persona", label: "運動習慣" }
        # - { field: "travel_persona", label: "旅行の好み" }
        # - { field: "arts_persona", label: "芸術・文化への関心" }
        # - { field: "skills_and_expertise", label: "スキル・専門性" }
        # - { field: "career_goals_and_ambitions", label: "キャリア目標" }

  # ----------------------------------------------------------------------------
  # A-3. 設問フォームの初期値（購入意向・新規性）
  #
  # 画面の初期値だが、編集された結果はそのまま調査定義の questions: になるので
  # survey_defaults 側に置いてある。
  #
  # top_box が無いと Question.is_ordinal() が偽になり、T2B も平均スコアも None になる。
  # 結果画面の指標が両方とも出なくなるので、順序尺度には必ず入れること。
  # randomize_options: false は順序尺度の不変条件（AGENTS.md）。
  #
  # system: は上の main_survey.prompt.systems の**名前**。省略すると
  # main_survey.prompt.system（既定）で聞かれる。綴りを間違えると調査定義の
  # 読み込みで停止する（黙って既定に落ちない）。
  # ----------------------------------------------------------------------------
  questions:
    - id: "q_purchase_intent"
      system: "purchase_intent"
      type: "single"
      text: "この製品がふだん買い物をするお店で売られているとしたら、あなたはあなたご自身のためにどの程度この製品を買いたいと思いますか。"
      options:
        - "必ず買う"
        - "たぶん買う"
        - "わからない"
        - "たぶん買わない"
        - "絶対に買わない"
      top_box: [1, 2]
      randomize_options: false
    - id: "q_novelty"
      system: "novelty"
      type: "single"
      text: "この製品は、他の{category}と比べて、どの程度目新しく、また違っていると思いますか。"
      options:
        - "非常に新しく、他と違っている"
        - "かなり新しく、他と違っている"
        - "新しく、他と違っている"
        - "少し新しく、他と違っている"
        - "全く新しくも、他と違ってもいない"
      top_box: [1, 2]
      randomize_options: false

  # ----------------------------------------------------------------------------
  # A-4. 集計軸
  #
  # 集計軸は割り付けの刻み幅に合わせて自動で決まる（base_segments ＋ 年代軸 ＋ cell_id）。
  # 5歳刻みで割り付けたのに10歳刻みでしか集計できないと、割り付けたセルを確認できない。
  #
  # 出力形式（formats）は書かない。結果は画面で見て、Excel / CSV のダウンロードは
  # 押されたその場で生成するので、ジョブ側でファイルを書き出す必要が無い。
  # ----------------------------------------------------------------------------
  output:
    base_segments: ["total", "sex"]

# ==============================================================================
# B. 画面の設定
#
# この下の内容は調査定義には入らない。画面の選択肢や見積もり表示にだけ使う。
# ==============================================================================
ui:
  # 割り付けパターン（画面のラジオボタン）
  #
  # 3つとも quotas.mode: proportion で比率を渡す。整数への配分は
  # persona_sim.panel.quotas.allocate_cell_sizes() の最大剰余法が行う（SPEC.md §4.1）。
  allocation_patterns:
    - { id: "sex_x_age10", label: "性別×10歳刻み均等", band: 10 }
    - { id: "sex_x_age5", label: "性別×5歳刻み均等", band: 5 }
    - { id: "census_age5", label: "国勢調査人口構成比（5歳刻み）", band: 5, census: true }

  # 見積もり用の実績値と単価
  #
  # 判定は1回で batch_size 人分のペルソナカードを渡すため、入力トークンが本調査の
  # 数十倍になる。同じ値で見積もると桁を間違えるので分けて持つ。
  # 実測を取り直したら、ここの数字だけ差し替えれば画面の見積もりが追随する。
  estimation_benchmarks:
    # 本調査は「1回答あたり」。セッション単位ではない（memory の設定でセッション数は
    # 回答数と一致しない）。現行のコンセプト調査は memory: none 固定なので
    # 1セッション＝1回答だが、記憶を持つ調査種別を足すならこの前提を見直すこと
    # （履歴を再生するぶん回答あたりの入力トークンが増える）。
    survey_answer:
      input_tokens_per_answer: 1600    # ペルソナカード ＋ 提示文 ＋ 設問（提示文の分量で変動）
      output_tokens_per_answer: 15     # 選択肢番号
      answers_per_min: 1190.6          # 実測。並列度込みのエンドツーエンド速度
    # 判定は1回で batch_size 人分をまとめて捌くので「1セッションあたり」。
    screener_session:
      input_tokens_per_session: 4500   # batch_size 人分のペルソナ像 ＋ 対象者条件
      output_tokens_per_session: 60    # 通過者の番号列
      sessions_per_min: 640            # 旧 avg_latency_sec 3.0 秒 × 並列度 32 相当
    # 画面に出す概算のための前提。ワークスペースの実請求ではない
    # （実行メタデータの estimated_cost は SPEC.md §9 のとおり null のまま）。
    # 単価はモデル改定で、為替は日々で動くので別々に持つ。
    pricing:
      input_usd_per_million: 1.0
      output_usd_per_million: 6.0
      jpy_per_usd: 150
      budget_margin: 1.1               # 提示文の分量と調査間のブレを吸収する安全側の係数
